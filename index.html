<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR欄｜素材名稱 - 每週成效統計分析</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PapaParse CSV 解析器 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <!-- Chart.js 圖表庫 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-4 md:p-8">
    <div class="max-w-7xl mx-auto space-y-5">

        <!-- 頂部標題區 -->
        <header class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <div class="flex items-center gap-2">
                    <span class="px-2.5 py-1 bg-indigo-600 text-white text-xs font-bold rounded-lg uppercase tracking-wider">AR 欄素材</span>
                    <h1 class="text-2xl font-bold text-slate-900 tracking-tight">素材名稱 (AR欄) 每週成效長條圖分析</h1>
                </div>
                <p class="text-sm text-slate-500 mt-1">資料來源：週報客資2 ｜ 依選定期間按「週」聚合統計 AR 欄素材成效</p>
            </div>
            <div class="flex items-center gap-3">
                <button id="refreshBtn" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-xl shadow-sm transition flex items-center gap-1.5 cursor-pointer">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    重新載入
                </button>
                <span id="loadStatus" class="text-xs px-3 py-1.5 bg-amber-50 text-amber-700 font-medium rounded-full border border-amber-200">讀取中...</span>
            </div>
        </header>

        <!-- 期間選擇器 (完全依照截圖樣式打造) -->
        <div class="bg-white rounded-2xl p-4 md:px-6 shadow-sm border border-slate-200 flex flex-col xl:flex-row items-start xl:items-center justify-between gap-4">
            <!-- 左側：日期區間輸入與套用 -->
            <div class="flex flex-wrap items-center gap-2 sm:gap-3 text-sm">
                <span class="font-bold text-slate-700 flex items-center gap-1 whitespace-nowrap">
                    📅 日期範圍：
                </span>
                <input type="date" id="startDate" class="bg-white border border-slate-300 rounded-xl px-3 py-2 text-sm text-slate-700 focus:ring-2 focus:ring-indigo-500 focus:outline-none shadow-sm cursor-pointer">
                <span class="text-slate-400 font-medium">至</span>
                <input type="date" id="endDate" class="bg-white border border-slate-300 rounded-xl px-3 py-2 text-sm text-slate-700 focus:ring-2 focus:ring-indigo-500 focus:outline-none shadow-sm cursor-pointer">
                
                <button id="applyDateBtn" class="px-4 py-2 bg-slate-800 hover:bg-slate-900 text-white text-sm font-medium rounded-xl shadow-sm transition">
                    套用篩選
                </button>
                <button id="clearDateBtn" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 text-sm font-medium rounded-xl transition">
                    清除
                </button>
            </div>

            <!-- 右側：快速切換按鈕組 -->
            <div class="flex flex-wrap items-center gap-2 text-sm text-slate-500">
                <span class="text-xs font-medium text-slate-400 mr-1">快速切換：</span>
                <button type="button" onclick="setQuickRange('2026-ytd')" class="quick-btn px-3 py-1.5 bg-blue-50 text-blue-600 hover:bg-blue-100 border border-blue-200 font-medium rounded-lg text-xs transition">
                    2026 年至今
                </button>
                <button type="button" onclick="setQuickRange('2025-06')" class="quick-btn px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs transition">
                    2025.06迄今
                </button>
                <button type="button" onclick="setQuickRange('this-month')" class="quick-btn px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs transition">
                    本月
                </button>
                <button type="button" onclick="setQuickRange('last-30')" class="quick-btn px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs transition">
                    近 30 天
                </button>
            </div>
        </div>

        <!-- 維度篩選列 -->
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase mb-2 tracking-wider">選擇統計週次</label>
                <select id="weekSelect" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-sm font-medium focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    <option value="all">📅 全部週次 (跨週匯總)</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase mb-2 tracking-wider">分類篩選 (C欄)</label>
                <select id="categoryFilter" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    <option value="all">全部分類</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase mb-2 tracking-wider">媒體篩選 (N欄)</label>
                <select id="mediaFilter" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    <option value="all">全部媒體</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase mb-2 tracking-wider">長條圖排行顯示</label>
                <select id="topLimit" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    <option value="10">Top 10 素材</option>
                    <option value="15" selected>Top 15 素材</option>
                    <option value="25">Top 25 素材</option>
                    <option value="999">全部素材</option>
                </select>
            </div>
        </div>

        <!-- 數據摘要卡片 -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">當前區間總客資</span>
                <div id="statTotalLeads" class="text-3xl font-extrabold text-slate-900 mt-2">-</div>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">不重複素材款數 (AR欄)</span>
                <div id="statMaterialTypes" class="text-3xl font-extrabold text-indigo-600 mt-2">-</div>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">成效冠軍素材 (Top 1)</span>
                <div id="statTopMaterial" class="text-base font-bold text-emerald-600 mt-2 truncate" title="-">-</div>
                <div id="statTopMaterialCount" class="text-xs text-slate-400 mt-0.5">-</div>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">素材填寫覆蓋率</span>
                <div id="statCoverage" class="text-3xl font-extrabold text-blue-600 mt-2">-</div>
            </div>
        </div>

        <!-- 長條圖視覺區 -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- 主要長條圖：AR欄素材排行 -->
            <div class="lg:col-span-2 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                <div class="flex justify-between items-center">
                    <div>
                        <h2 id="barChartTitle" class="text-base font-bold text-slate-800">AR欄｜各素材名稱成效長條圖</h2>
                        <p class="text-xs text-slate-400 mt-0.5">橫軸：客資進件數 (筆) ｜ 縱軸：素材名稱</p>
                    </div>
                </div>
                <div class="h-[420px] relative">
                    <canvas id="materialBarChart"></canvas>
                </div>
            </div>

            <!-- 次要長條圖：各週總進件量 -->
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                <div>
                    <h2 class="text-base font-bold text-slate-800">各週客資總進件長條圖</h2>
                    <p class="text-xs text-slate-400 mt-0.5">依週次 (Week) 統計進件走勢</p>
                </div>
                <div class="h-[420px] relative">
                    <canvas id="weeklyBarChart"></canvas>
                </div>
            </div>
        </div>

        <!-- 彙總表格 -->
        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="p-5 border-b border-slate-100 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 bg-slate-50/50">
                <div>
                    <h2 class="text-base font-bold text-slate-800">素材名稱 (AR欄) 成效明細矩陣</h2>
                    <p class="text-xs text-slate-400 mt-0.5">依客資進件成效筆數降序排列</p>
                </div>
                <span id="tableSummaryCount" class="text-xs font-medium text-slate-600 bg-white px-3 py-1 rounded-full border border-slate-200"></span>
            </div>
            <div class="overflow-x-auto max-h-[460px]">
                <table class="w-full text-left border-collapse text-xs">
                    <thead class="bg-slate-50 text-slate-500 sticky top-0 border-b border-slate-200 uppercase font-semibold">
                        <tr>
                            <th class="p-3.5 pl-6">排名</th>
                            <th class="p-3.5">週次</th>
                            <th class="p-3.5">素材名稱 (AR欄)</th>
                            <th class="p-3.5">媒體 (N欄)</th>
                            <th class="p-3.5">分類 (C欄)</th>
                            <th class="p-3.5 text-right font-bold">成效客資數</th>
                            <th class="p-3.5 pr-6 text-right">佔比</th>
                        </tr>
                    </thead>
                    <tbody id="summaryTableBody" class="divide-y divide-slate-100 font-mono">
                        <tr><td colspan="7" class="p-6 text-center text-slate-400">載入中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT89XIeyzq77eYwwxxzJsOP8K7i6xRkWsa3vdPzIk8KEJsWZJWN9-FqrG8oKQW2nzJFrlaukXjAPawb/pub?gid=596409932&single=true&output=csv';

        let rawData = [];
        let materialBarChartInstance = null;
        let weeklyBarChartInstance = null;

        // 計算 ISO 8601 週 (YYYY-Www)
        function getISOWeek(dateStr) {
            if (!dateStr) return '未註記週次';
            const cleanStr = String(dateStr).replace(/\//g, '-').trim().split(' ')[0];
            const d = new Date(cleanStr);
            if (isNaN(d.getTime())) return '未註記週次';

            const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            const dayNum = date.getUTCDay() || 7;
            date.setUTCDate(date.getUTCDate() + 4 - dayNum);
            const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
            const weekNo = Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
            return `${date.getUTCFullYear()}-W${String(weekNo).padStart(2, '0')}`;
        }

        // 標準化日期字串 (YYYY-MM-DD)
        function standardizeDate(dateStr) {
            if (!dateStr) return '';
            const clean = String(dateStr).replace(/\//g, '-').trim().split(' ')[0];
            const parts = clean.split('-');
            if (parts.length === 3) {
                const y = parts[0];
                const m = parts[1].padStart(2, '0');
                const d = parts[2].padStart(2, '0');
                return `${y}-${m}-${d}`;
            }
            return clean;
        }

        async function loadData() {
            const status = document.getElementById('loadStatus');
            status.textContent = '讀取中...';
            status.className = 'text-xs px-3 py-1.5 bg-amber-50 text-amber-700 font-medium rounded-full border border-amber-200';

            Papa.parse(CSV_URL, {
                download: true,
                header: false,
                skipEmptyLines: true,
                complete: function(results) {
                    if (results.data && results.data.length > 0) {
                        parseSheetData(results.data);
                    } else {
                        showError('CSV 內無有效資料');
                    }
                },
                error: function(err) {
                    console.error('PapaParse 失敗，嘗試 fetch 備援:', err);
                    fetch(CSV_URL)
                        .then(res => res.text())
                        .then(csvText => {
                            const parsed = Papa.parse(csvText, { header: false, skipEmptyLines: true });
                            parseSheetData(parsed.data);
                        })
                        .catch(fetchErr => {
                            showError('讀取失敗，請確認已公開發佈 CSV');
                            console.error(fetchErr);
                        });
                }
            });
        }

        function parseSheetData(rows) {
            const status = document.getElementById('loadStatus');
            if (!rows || rows.length <= 1) {
                showError('試算表內容為空');
                return;
            }

            let headerIdx = 0;
            let colCat = 2;       // C欄 (分類)
            let colMedia = 13;    // N欄 (媒體)
            let colDate = 7;      // H欄 (留單日)
            let colAR = 43;       // AR欄 (素材名稱)

            // 自動配對欄位
            for (let i = 0; i < Math.min(rows.length, 5); i++) {
                const row = rows[i];
                const rStr = row.join(' ');
                if (rStr.includes('分類') || rStr.includes('媒體') || rStr.includes('留單') || rStr.includes('素材')) {
                    headerIdx = i;
                    row.forEach((colName, cIdx) => {
                        const name = String(colName).trim();
                        if (name.includes('分類')) colCat = cIdx;
                        if (name.includes('媒體')) colMedia = cIdx;
                        if (name.includes('留單日') || name.includes('建檔日')) colDate = cIdx;
                        if (name.includes('素材')) colAR = cIdx;
                    });
                    break;
                }
            }

            rawData = [];
            let minDate = '9999-99-99';
            let maxDate = '0000-00-00';

            for (let i = headerIdx + 1; i < rows.length; i++) {
                const r = rows[i];
                if (!r || r.length === 0) continue;

                const catVal = (r[colCat] !== undefined && r[colCat] !== '') ? String(r[colCat]).trim() : '未分類';
                const mediaVal = (r[colMedia] !== undefined && r[colMedia] !== '') ? String(r[colMedia]).trim() : '未填寫';
                const dateVal = (r[colDate] || r[7] || r[8] || r[6] || r[5] || '').toString().trim();
                const arVal = (r[colAR] !== undefined && r[colAR] !== null) ? String(r[colAR]).trim() : '';

                if (catVal === '未分類' && mediaVal === '未填寫' && !dateVal && !arVal) {
                    continue;
                }

                const stdDate = standardizeDate(dateVal);
                if (stdDate && stdDate.length === 10) {
                    if (stdDate < minDate) minDate = stdDate;
                    if (stdDate > maxDate) maxDate = stdDate;
                }

                rawData.push({
                    id: i,
                    category: catVal,
                    media: mediaVal,
                    date: stdDate,
                    week: getISOWeek(stdDate),
                    material: arVal || '(未填寫素材)',
                    hasMaterial: arVal !== '' && arVal !== '-'
                });
            }

            // 初始化日期選擇器預設值 (2026/01/01 至 最新日期)
            if (minDate !== '9999-99-99' && maxDate !== '0000-00-00') {
                document.getElementById('startDate').value = '2026-01-01';
                document.getElementById('endDate').value = maxDate;
            }

            populateFilterOptions();
            renderDashboard();

            status.textContent = `同步完成 (${rawData.length} 筆)`;
            status.className = 'text-xs px-3 py-1.5 bg-emerald-50 text-emerald-700 font-medium rounded-full border border-emerald-200';
        }

        function showError(msg) {
            const status = document.getElementById('loadStatus');
            status.textContent = msg;
            status.className = 'text-xs px-3 py-1.5 bg-rose-50 text-rose-700 font-medium rounded-full border border-rose-200';
        }

        function populateFilterOptions() {
            const weeks = [...new Set(rawData.map(d => d.week))].filter(w => w !== '未註記週次').sort().reverse();
            const weekSelect = document.getElementById('weekSelect');
            weekSelect.innerHTML = '<option value="all">📅 全部週次 (跨週匯總)</option>' +
                weeks.map(w => `<option value="${w}">${w}</option>`).join('');

            const categories = [...new Set(rawData.map(d => d.category))].filter(Boolean);
            const mediaList = [...new Set(rawData.map(d => d.media))].filter(Boolean);

            document.getElementById('categoryFilter').innerHTML = '<option value="all">全部分類</option>' + categories.map(c => `<option value="${c}">${c}</option>`).join('');
            document.getElementById('mediaFilter').innerHTML = '<option value="all">全部媒體</option>' + mediaList.map(m => `<option value="${m}">${m}</option>`).join('');
        }

        // 快速切換期間邏輯
        function setQuickRange(type) {
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            const todayStr = `${yyyy}-${mm}-${dd}`;

            // 重設快捷按鈕樣式
            document.querySelectorAll('.quick-btn').forEach(btn => {
                btn.className = 'quick-btn px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs transition';
            });
            event.target.className = 'quick-btn px-3 py-1.5 bg-blue-50 text-blue-600 hover:bg-blue-100 border border-blue-200 font-medium rounded-lg text-xs transition';

            if (type === '2026-ytd') {
                document.getElementById('startDate').value = '2026-01-01';
                document.getElementById('endDate').value = todayStr;
            } else if (type === '2025-06') {
                document.getElementById('startDate').value = '2025-06-01';
                document.getElementById('endDate').value = todayStr;
            } else if (type === 'this-month') {
                document.getElementById('startDate').value = `${yyyy}-${mm}-01`;
                document.getElementById('endDate').value = todayStr;
            } else if (type === 'last-30') {
                const past = new Date(today.getTime() - 30 * 24 * 60 * 60 * 1000);
                const pY = past.getFullYear();
                const pM = String(past.getMonth() + 1).padStart(2, '0');
                const pD = String(past.getDate()).padStart(2, '0');
                document.getElementById('startDate').value = `${pY}-${pM}-${pD}`;
                document.getElementById('endDate').value = todayStr;
            }
            renderDashboard();
        }

        function renderDashboard() {
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            const selectedWeek = document.getElementById('weekSelect').value;
            const selectedCat = document.getElementById('categoryFilter').value;
            const selectedMedia = document.getElementById('mediaFilter').value;
            const topLimit = parseInt(document.getElementById('topLimit').value, 10) || 15;

            // 綜合篩選：日期範圍 + 週次 + 分類 + 媒體
            const filtered = rawData.filter(d => {
                // 日期範圍判斷
                if (d.date) {
                    if (startDate && d.date < startDate) return false;
                    if (endDate && d.date > endDate) return false;
                }
                const weekMatch = selectedWeek === 'all' || d.week === selectedWeek;
                const catMatch = selectedCat === 'all' || d.category === selectedCat;
                const mediaMatch = selectedMedia === 'all' || d.media === selectedMedia;
                return weekMatch && catMatch && mediaMatch;
            });

            // 指標統計
            const totalLeads = filtered.length;
            const materialCounts = {};
            const weeklyCounts = {};
            let validMaterialCount = 0;

            filtered.forEach(d => {
                if (d.hasMaterial) validMaterialCount++;
                materialCounts[d.material] = (materialCounts[d.material] || 0) + 1;
                weeklyCounts[d.week] = (weeklyCounts[d.week] || 0) + 1;
            });

            const uniqueMaterials = Object.keys(materialCounts).filter(m => m !== '(未填寫素材)').length;
            const sortedMaterials = Object.entries(materialCounts).sort((a, b) => b[1] - a[1]);
            const topOne = sortedMaterials.find(m => m[0] !== '(未填寫素材)') || sortedMaterials[0];

            document.getElementById('statTotalLeads').textContent = totalLeads.toLocaleString();
            document.getElementById('statMaterialTypes').textContent = `${uniqueMaterials} 款`;
            document.getElementById('statCoverage').textContent = totalLeads > 0 ? `${Math.round((validMaterialCount / totalLeads) * 100)}%` : '0%';

            if (topOne && totalLeads > 0) {
                document.getElementById('statTopMaterial').textContent = topOne[0];
                document.getElementById('statTopMaterialCount').textContent = `成效 ${topOne[1]} 筆 (${Math.round((topOne[1] / totalLeads) * 100)}%)`;
            } else {
                document.getElementById('statTopMaterial').textContent = '-';
                document.getElementById('statTopMaterialCount').textContent = '-';
            }

            // 更新長條圖與表格
            renderMaterialBarChart(sortedMaterials.slice(0, topLimit), selectedWeek, startDate, endDate);
            renderWeeklyBarChart(weeklyCounts);
            renderSummaryTable(filtered);
        }

        // 水平長條圖
        function renderMaterialBarChart(materialData, weekLabel, startDate, endDate) {
            const ctx = document.getElementById('materialBarChart').getContext('2d');
            const titleEl = document.getElementById('barChartTitle');
            
            let rangeText = '';
            if (startDate || endDate) rangeText = ` [${startDate || '起'} ~ ${endDate || '迄'}]`;
            titleEl.textContent = weekLabel === 'all' ? `AR欄素材成效排行長條圖${rangeText}` : `${weekLabel} - AR欄素材成效長條圖${rangeText}`;

            if (materialBarChartInstance) materialBarChartInstance.destroy();

            const labels = materialData.map(d => d[0]);
            const values = materialData.map(d => d[1]);

            materialBarChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '客資進件數 (筆)',
                        data: values,
                        backgroundColor: '#4f46e5',
                        borderRadius: 6,
                        barThickness: labels.length > 15 ? 12 : 18
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: (c) => ` 客資進件數: ${c.parsed.x} 筆`
                            }
                        }
                    },
                    scales: {
                        x: {
                            beginAtZero: true,
                            ticks: { precision: 0 },
                            grid: { color: '#f1f5f9' }
                        },
                        y: {
                            grid: { display: false },
                            ticks: {
                                font: { size: 11 },
                                callback: function(value) {
                                    const label = this.getLabelForValue(value);
                                    return label.length > 22 ? label.substr(0, 20) + '...' : label;
                                }
                            }
                        }
                    }
                }
            });
        }

        // 垂直長條圖 (每週客資走勢)
        function renderWeeklyBarChart(weeklyCounts) {
            const ctx = document.getElementById('weeklyBarChart').getContext('2d');
            if (weeklyBarChartInstance) weeklyBarChartInstance.destroy();

            const sortedWeeks = Object.keys(weeklyCounts).filter(w => w !== '未註記週次').sort();
            const values = sortedWeeks.map(w => weeklyCounts[w]);

            weeklyBarChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: sortedWeeks,
                    datasets: [{
                        label: '當週客資數',
                        data: values,
                        backgroundColor: '#2563eb',
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { precision: 0 },
                            grid: { color: '#f1f5f9' }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { font: { size: 10 } }
                        }
                    }
                }
            });
        }

        // 彙總表格
        function renderSummaryTable(filteredData) {
            const grouped = {};
            const totalInSelection = filteredData.length;

            filteredData.forEach(d => {
                const key = `${d.week}___${d.material}___${d.media}___${d.category}`;
                if (!grouped[key]) {
                    grouped[key] = {
                        week: d.week,
                        material: d.material,
                        media: d.media,
                        category: d.category,
                        count: 0
                    };
                }
                grouped[key].count += 1;
            });

            const sortedList = Object.values(grouped).sort((a, b) => b.count - a.count);
            const tbody = document.getElementById('summaryTableBody');
            document.getElementById('tableSummaryCount').textContent = `共 ${sortedList.length} 組維度統計`;

            if (sortedList.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="p-6 text-center text-slate-400">無符合條件之資料</td></tr>';
                return;
            }

            tbody.innerHTML = sortedList.map((item, idx) => {
                const percent = totalInSelection > 0 ? Math.round((item.count / totalInSelection) * 100) : 0;
                return `
                    <tr class="hover:bg-slate-50 transition">
                        <td class="p-3.5 pl-6 font-bold text-slate-400">#${idx + 1}</td>
                        <td class="p-3.5 font-semibold text-slate-700">${item.week}</td>
                        <td class="p-3.5 font-sans font-medium text-slate-900">
                            <span class="${item.material === '(未填寫素材)' ? 'text-slate-400 italic' : 'text-indigo-600'}">${item.material}</span>
                        </td>
                        <td class="p-3.5"><span class="px-2 py-0.5 bg-slate-100 rounded text-slate-700 font-sans">${item.media}</span></td>
                        <td class="p-3.5 text-slate-600 font-sans">${item.category}</td>
                        <td class="p-3.5 text-right font-bold text-slate-900">${item.count}</td>
                        <td class="p-3.5 pr-6 text-right font-semibold text-emerald-600">${percent}%</td>
                    </tr>
                `;
            }).join('');
        }

        // 事件綁定
        document.getElementById('applyDateBtn').addEventListener('click', renderDashboard);
        document.getElementById('clearDateBtn').addEventListener('click', () => {
            document.getElementById('startDate').value = '';
            document.getElementById('endDate').value = '';
            renderDashboard();
        });
        document.getElementById('startDate').addEventListener('change', renderDashboard);
        document.getElementById('endDate').addEventListener('change', renderDashboard);
        document.getElementById('weekSelect').addEventListener('change', renderDashboard);
        document.getElementById('categoryFilter').addEventListener('change', renderDashboard);
        document.getElementById('mediaFilter').addEventListener('change', renderDashboard);
        document.getElementById('topLimit').addEventListener('change', renderDashboard);
        document.getElementById('refreshBtn').addEventListener('click', loadData);

        // 初始化載入
        loadData();
    </script>
</body>
</html>
